<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Air Quality</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>
<body class="predict">
    <div class="form-container">
        <h2>Enter Data for Air Quality Prediction</h2>
        <form id="prediction-form" action="/predict" method="post">
            <input type="text" name="temperature" placeholder="Temperature" required>
            <input type="text" name="humidity" placeholder="Humidity" required>
            <input type="text" name="pm2_5" placeholder="PM2.5" required>
            <input type="text" name="pm10" placeholder="PM10" required>
            <input type="text" name="no2" placeholder="NO2" required>
            <input type="text" name="so2" placeholder="SO2" required>
            <input type="text" name="co" placeholder="CO" required>
            <input type="text" name="industrial_area_proximity" placeholder="Proximity to Industrial Areas" required>
            <input type="text" name="population_density" placeholder="Population Density" required>
            <div class="prediction">
                <button type="submit" class="predict-btn">Predict</button>
            </div>
        </form>
        <h3 id="result"></h3>
    </div>
    <div class="button-group">
        <a href="/" class="home-btn">Back to Home</a>
    </div>    
</body>
</html>
